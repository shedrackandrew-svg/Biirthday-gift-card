<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Birthday Gift Card</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Birthday Gift Card</h1>
    <section class="card">
      <label for="name">Name</label>
      <input id="name" placeholder="Friend's name">
      <label for="phone">Phone (E.164, e.g. +15551234567)</label>
      <input id="phone" placeholder="Phone number" type="tel">
      <label for="email">Email</label>
      <input id="email" placeholder="email@example.com" type="email">
      <label for="gender">Gender</label>
      <select id="gender">
        <option value="unspecified">Prefer not to say</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other</option>
      </select>
      <label for="bday">Birthday</label>
      <input id="bday" type="date">
      <div class="row">
        <button id="saveBtn">Save Details</button>
        <button id="generateBtn">Generate Gift Card</button>
        <button id="sendBtn">Send</button>
      </div>
      <p class="note">Send now uses your phone's share sheet or opens WhatsApp/email directly. No server needed.</p>
    </section>

    <section class="card" id="giftCardArea" hidden>
      <h2>Gift Card</h2>
      <canvas id="giftCanvas" width="600" height="400"></canvas>
      <div class="row">
        <button id="downloadBtn">Download PNG</button>
        <button id="closeGiftBtn">Close</button>
      </div>
    </section>
  </main>

  <!-- modal removed -->

  <script src="app.js" defer></script>
</body>
</html>
